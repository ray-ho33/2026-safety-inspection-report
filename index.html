<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 행정안전부 안전점검 보고서 장별 검색과 사실 정합성 매트릭스">
  <title>2026 안전점검 보고서</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <p class="eyebrow">행정안전부 안전관리과</p>
      <h1>2026 안전점검 결과 보고서</h1>
      <p class="hero__copy">보고서 5개 장을 검색하고 핵심 사실의 정합성을 한눈에 확인하세요.</p>
    </div>
  </header>

  <main>
    <section aria-labelledby="chapters-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">REPORT CHAPTERS</p>
          <h2 id="chapters-title">장별 보고서</h2>
        </div>
        <p id="result-count" class="result-count" aria-live="polite">결과 0건</p>
      </div>
      <label class="search">
        <span class="sr-only">제목 또는 본문 검색</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
        <input id="search-input" type="search" placeholder="제목 또는 본문에서 검색" autocomplete="off">
      </label>
      <div id="chapter-list" class="cards" aria-busy="true"></div>
      <p id="empty-state" class="empty" hidden>검색 결과가 없습니다.</p>
      <p id="error-state" class="error" hidden>장 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>
    </section>

    <section class="matrix" aria-labelledby="matrix-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">CONSISTENCY MATRIX</p>
          <h2 id="matrix-title">보고서 5사실 정합성</h2>
        </div>
      </div>
      <div class="sheet-frame">
        <iframe id="consistency-sheet" title="보고서 5사실 정합성 Google Sheets" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>
    </section>
  </main>

  <footer>2026 행정안전부 안전점검 결과 보고서 · 가상 자료</footer>
</body>
</html>
